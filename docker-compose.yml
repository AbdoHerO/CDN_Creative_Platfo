services:
  creative-hub-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: creative-hub-prod:latest
    container_name: creative-hub-prod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    networks:
      - backend.prod

  # Background jobs: ZIP imports, thumbnails, checksums, PDF page counts, deletions.
  creative-hub-worker:
    image: creative-hub-prod:latest
    container_name: creative-hub-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file:
      - ${ENV_FILE:-.env.prod}
    depends_on:
      - creative-hub-prod
    networks:
      - backend.prod

networks:
  backend.prod:
    external: true
